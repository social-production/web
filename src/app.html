<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <link rel="icon" type="image/png" href="%sveltekit.assets%/favicon.png?v=3" />
    <link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png?v=3" />
    <meta name="theme-color" content="#181a1b" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Social Production" />
    <script>
      (function () {
        try {
          var theme = localStorage.getItem('sp_theme');
          if (theme === 'dark' || theme === 'light') {
            document.documentElement.dataset.theme = theme;
            document.body && (document.body.dataset.theme = theme);
          }
        } catch (e) {}
      })();
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover" data-theme="light">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
